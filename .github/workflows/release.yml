name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 — no leading v)"
        required: true
        type: string

# Least privilege by default: only the jobs that publish declare contents: write.
# Every action is pinned to a commit SHA (the tag it corresponds to is in the comment).
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag on workflow_dispatch
    outputs:
      version: ${{ steps.ver.outputs.version }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Determine version
        id: ver
        # Untrusted values arrive via env only, never interpolated into the
        # script text, so a crafted input/ref cannot inject shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          VERSION="${VERSION#v}"
          # Strict SemVer core with optional prerelease/build metadata,
          # anchored to the whole single-line string by the bash regex.
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! $VERSION =~ $SEMVER_RE ]]; then
            echo "::error::Version is not valid SemVer (expected e.g. 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi
          # Assembly/File versions accept numeric components only.
          ASSEMBLY_VERSION="$(echo "$VERSION" | cut -d- -f1 | cut -d+ -f1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch'

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  publish-binaries:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: dotver.exe
            asset: dotver-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: dotver
            asset: dotver-linux-x64
          - os: macos-latest
            rid: osx-arm64
            binary: dotver
            asset: dotver-osx-arm64
          - os: macos-latest
            rid: osx-x64
            binary: dotver
            asset: dotver-osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ASSEMBLY_VERSION: ${{ needs.setup.outputs.assembly_version }}
        run: |
          dotnet publish src/DotVer.Cli/DotVer.Cli.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -o artifacts/publish/${{ matrix.rid }}

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" "artifacts/release/${{ matrix.asset }}"

          if ("${{ matrix.rid }}" -eq "win-x64") {
            Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" -DestinationPath "artifacts/release/dotver-win-x64-portable.zip" -Force
          }

      - name: Compute SHA256
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name)  $hash"
          } | Set-Content artifacts/release/checksums-${{ matrix.rid }}.txt

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*

  github-release:
    runs-on: ubuntu-latest
    needs: [setup, publish-binaries]
    permissions:
      contents: write # creates the GitHub release and uploads its assets

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/release

      - name: Flatten and collate checksums
        run: |
          mkdir -p artifacts/final
          find artifacts/release -type f ! -name 'checksums-*.txt' -exec cp {} artifacts/final/ \;
          cat artifacts/release/*/checksums-*.txt | sort > artifacts/final/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: dotver ${{ needs.setup.outputs.tag }}
          files: artifacts/final/*
          generate_release_notes: true

  npm-package:
    runs-on: ubuntu-latest
    needs: [setup, github-release]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.setup.outputs.tag }}

      # The package embeds the SHA-256 of each binary so postinstall can verify
      # what it downloads. Take the digests from this run's build artifacts,
      # never from a re-download of the published assets.
      - name: Download build checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts/release

      - name: Collate checksums
        run: cat artifacts/release/*/checksums-*.txt | sort > artifacts/checksums.txt

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare package
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./.github/scripts/Prepare-NpmPackage.ps1 -Version $env:VERSION -Repository $env:REPOSITORY -ChecksumsPath artifacts/checksums.txt

      - name: Verify package contents
        run: |
          cd artifacts/npm
          node --check scripts/install.mjs
          node --check scripts/lib.mjs
          test -f bin/dotver.js
          test -f bin/dotnet.js
          npm pack --dry-run

      # The secrets context is not allowed in step `if` expressions (it fails
      # the whole workflow at parse time). Probe for the token in a step whose
      # only output is a boolean; the secret itself stays out of every other step.
      - name: Check npm token
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ steps.npm-token.outputs.present == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd artifacts/npm
          npm publish --access public

      - name: Upload npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: artifacts/npm

  winget-manifest:
    runs-on: windows-latest
    needs: [setup, github-release]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.setup.outputs.tag }}

      # Hash the artifact this run built instead of re-downloading the
      # published asset: a swapped asset must not be laundered into the manifest.
      - name: Download win-x64 build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-win-x64
          path: artifacts/release

      - name: Compute installer SHA256
        shell: pwsh
        run: |
          $sha256 = (Get-FileHash "artifacts/release/dotver-win-x64-portable.zip" -Algorithm SHA256).Hash.ToUpper()
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
        run: |
          $packageIdentifier = if ($env:PACKAGE_IDENTIFIER) { $env:PACKAGE_IDENTIFIER } else { "DotVer.DotVer" }
          ./.github/scripts/Generate-WingetManifest.ps1 `
            -Version $env:VERSION `
            -Repository $env:REPOSITORY `
            -PackageIdentifier $packageIdentifier `
            -InstallerSha256 $env:INSTALLER_SHA256

      # Same probe pattern as npm: the token is only ever exposed to the step
      # that needs it, never to the whole job.
      - name: Check WinGet token
        id: winget-token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to WinGet
        if: ${{ vars.WINGET_PACKAGE_IDENTIFIER != '' && steps.winget-token.outputs.present == 'true' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
          version: ${{ needs.setup.outputs.version }}
          release-tag: ${{ needs.setup.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Upload winget manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests
          path: artifacts/winget
