name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: dotver.exe
            asset: dotver-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: dotver
            asset: dotver-linux-x64
          - os: macos-latest
            rid: osx-arm64
            binary: dotver
            asset: dotver-osx-arm64
          - os: macos-latest
            rid: osx-x64
            binary: dotver
            asset: dotver-osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/DotVer.Cli/DotVer.Cli.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/publish/${{ matrix.rid }}

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" "artifacts/release/${{ matrix.asset }}"

          if ("${{ matrix.rid }}" -eq "win-x64") {
            Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" -DestinationPath "artifacts/release/dotver-win-x64-portable.zip" -Force
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*

  github-release:
    runs-on: ubuntu-latest
    needs: publish-binaries

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release

      - name: Flatten artifacts
        run: |
          mkdir -p artifacts/final
          find artifacts/release -type f -exec cp {} artifacts/final/ \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/final/*
          generate_release_notes: true

  npm-package:
    runs-on: windows-latest
    needs: github-release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./.github/scripts/Prepare-NpmPackage.ps1 -Version $version -Repository "${{ github.repository }}"

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          Push-Location artifacts/npm
          npm publish --access public
          Pop-Location

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm

  winget-manifest:
    runs-on: windows-latest
    needs: github-release

    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $packageIdentifier = if ("${{ vars.WINGET_PACKAGE_IDENTIFIER }}") { "${{ vars.WINGET_PACKAGE_IDENTIFIER }}" } else { "DotVer.DotVer" }
          ./.github/scripts/Generate-WingetManifest.ps1 -Version $version -Repository "${{ github.repository }}" -PackageIdentifier $packageIdentifier

      - name: Upload winget manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: artifacts/winget
