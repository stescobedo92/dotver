name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 — no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

  publish-binaries:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: dotver.exe
            asset: dotver-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: dotver
            asset: dotver-linux-x64
          - os: macos-latest
            rid: osx-arm64
            binary: dotver
            asset: dotver-osx-arm64
          - os: macos-latest
            rid: osx-x64
            binary: dotver
            asset: dotver-osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          dotnet publish src/DotVer.Cli/DotVer.Cli.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$env:VERSION `
            -p:FileVersion=$env:VERSION `
            -o artifacts/publish/${{ matrix.rid }}

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" "artifacts/release/${{ matrix.asset }}"

          if ("${{ matrix.rid }}" -eq "win-x64") {
            Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/${{ matrix.binary }}" -DestinationPath "artifacts/release/dotver-win-x64-portable.zip" -Force
          }

      - name: Compute SHA256
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name)  $hash"
          } | Set-Content artifacts/release/checksums-${{ matrix.rid }}.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*

  github-release:
    runs-on: ubuntu-latest
    needs: [setup, publish-binaries]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release

      - name: Flatten and collate checksums
        run: |
          mkdir -p artifacts/final
          find artifacts/release -type f ! -name 'checksums-*.txt' -exec cp {} artifacts/final/ \;
          cat artifacts/release/*/checksums-*.txt | sort > artifacts/final/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: dotver ${{ needs.setup.outputs.tag }}
          files: artifacts/final/*
          generate_release_notes: true

  npm-package:
    runs-on: ubuntu-latest
    needs: [setup, github-release]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          pwsh -Command "./.github/scripts/Prepare-NpmPackage.ps1 -Version '$env:VERSION' -Repository '${{ github.repository }}'"

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd artifacts/npm
          npm publish --access public

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm

  winget-manifest:
    runs-on: windows-latest
    needs: [setup, github-release]
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Download win-x64 zip for SHA256
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/dotver-win-x64-portable.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile "dotver-win-x64-portable.zip"
          $sha256 = (Get-FileHash "dotver-win-x64-portable.zip" -Algorithm SHA256).Hash.ToUpper()
          echo "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $packageIdentifier = if ("${{ vars.WINGET_PACKAGE_IDENTIFIER }}") { "${{ vars.WINGET_PACKAGE_IDENTIFIER }}" } else { "DotVer.DotVer" }
          ./.github/scripts/Generate-WingetManifest.ps1 `
            -Version $env:VERSION `
            -Repository "${{ github.repository }}" `
            -PackageIdentifier $packageIdentifier `
            -InstallerSha256 $env:INSTALLER_SHA256

      - name: Submit to WinGet
        if: ${{ vars.WINGET_PACKAGE_IDENTIFIER != '' && env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
          version: ${{ needs.setup.outputs.version }}
          release-tag: ${{ needs.setup.outputs.tag }}
          token: ${{ env.WINGET_TOKEN }}

      - name: Upload winget manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: artifacts/winget
