name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotVer.slnx

      - name: Build
        run: dotnet build DotVer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DotVer.slnx --configuration Release --no-build

      # The npm postinstall verifies binary checksums; keep its logic tested too.
      - name: npm installer tests
        run: node --test packaging/npm/test/install.test.mjs
